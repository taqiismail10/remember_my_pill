services:
  db:
    image: postgres:16-alpine
    container_name: rmp-phase2-test-db
    environment:
      POSTGRES_USER: rmp_test
      POSTGRES_PASSWORD: rmp_test_only
      POSTGRES_DB: remember_my_pill_test
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmp_test -d remember_my_pill_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rmp_phase2_test_data:/var/lib/postgresql/data

volumes:
  rmp_phase2_test_data:
