services:
  db:
    image: postgres:16-alpine
    container_name: rmp-phase2-dev-db
    environment:
      POSTGRES_USER: rmp_local
      POSTGRES_PASSWORD: rmp_local_only
      POSTGRES_DB: remember_my_pill
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmp_local -d remember_my_pill"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [rmp_phase2_dev_data:/var/lib/postgresql/data]
volumes:
  rmp_phase2_dev_data:
